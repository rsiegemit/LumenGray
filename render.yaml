# Render.com blueprint — one-click cloud hosting for LumenGray.
# Connect this repo on Render (or use the "Deploy to Render" button in the
# README) and every push to the default branch auto-redeploys the latest code.
services:
  - type: web
    name: lumengray
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install ".[web]"
    startCommand: uvicorn lumengray.web.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
