# Render.com blueprint — one-click cloud hosting for LumenGray.
# Uses the Docker runtime (the repo Dockerfile) for a deterministic build that
# matches what we test locally — avoids native build-env / Python-version
# variability. Every push to the default branch auto-redeploys.
services:
  - type: web
    name: lumengray
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
