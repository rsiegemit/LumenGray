name: Build desktop apps

# Builds the double-click LumenGray desktop app for macOS and Windows.
# Artifacts are uploaded on every run; tagged pushes (v*) also attach to a Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed for the release-attach step on tags

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[web]" pyinstaller

      # Stamp the release version so the app's "Check for updates" knows what it is.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          printf '__version__ = "%s"\n' "$VER" > lumengray/_version.py
          cat lumengray/_version.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/LumenGray.spec

      # --- macOS: zip the .app bundle (preserves the bundle structure) ---
      - name: Package macOS .app
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent LumenGray.app LumenGray-macos.zip

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LumenGray-macos
          path: dist/LumenGray-macos.zip

      # --- macOS: drag-to-install .dmg (the .app + an Applications alias) ---
      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg_stage
          cp -R dist/LumenGray.app dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "LumenGray" -srcfolder dmg_stage -ov -format UDZO dist/LumenGray-macos.dmg

      - name: Upload macOS dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LumenGray-macos-dmg
          path: dist/LumenGray-macos.dmg

      # --- Windows: zip the one-folder build containing LumenGray.exe ---
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LumenGray/* -DestinationPath dist/LumenGray-windows.zip -Force

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LumenGray-windows
          path: dist/LumenGray-windows.zip

      # --- Windows: build the one-click installer (LumenGray-Setup.exe) ---
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "0.1.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = ($env:GITHUB_REF -replace "refs/tags/v","") }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\lumengray.iss

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: LumenGray-Setup
          path: dist/LumenGray-Setup.exe

      # --- On tag pushes, attach the build to the GitHub Release ---
      - name: Attach to Release (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LumenGray-macos.dmg
            dist/LumenGray-macos.zip

      - name: Attach to Release (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LumenGray-Setup.exe
            dist/LumenGray-windows.zip
