[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumengray"
dynamic = ["version"]
description = "STL → grayscale photostack studio for the Lumen X3 (CLI + web UI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rsiegemit" }]
keywords = ["3d-printing", "resin", "photostack", "grayscale", "stl", "lumen", "slicer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pillow>=10.0",
  # [easy] pulls networkx + shapely etc. — required for mesh.section slicing.
  # A bare `trimesh` install omits them and slicing fails at runtime.
  "trimesh[easy]>=4.0",
  # boolean backend for drilling channels into presets (box.difference).
  "manifold3d>=2.3",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.scripts]
lumengray = "lumengray.cli:main"
lumengray-web = "lumengray.web.__main__:main"

[project.urls]
Homepage = "https://github.com/rsiegemit/LumenGray"
Repository = "https://github.com/rsiegemit/LumenGray"

[tool.setuptools]
packages = ["lumengray", "lumengray.web"]

[tool.setuptools.dynamic]
version = { attr = "lumengray._version.__version__" }

[tool.setuptools.package-data]
"lumengray.web" = ["static/*", "static/vendor/three/*", "static/vendor/three/addons/controls/*", "static/vendor/three/addons/loaders/*"]
